name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || true
          # ensure cmdline-tools available
          set -e
          sdkmanager --version || (echo "sdkmanager not found, trying cmdline-tools path" && ls -R $ANDROID_HOME)
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          sdkmanager --list | head -n 50 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: |
            🎮 **Ragdoll Sasny** — APK готов к установке!
            
            **Как установить на Android (актуально на 11 ноября 2027):**
            1. Скачай `app-debug.apk` ниже
            2. Открой файл на телефоне
            3. Разреши установку из неизвестных источников если попросит
            4. Играй! Хватай куклу за любую часть тела и кидай в город — всё разрушаемо.
            
            **Управление:**
            - Зажми палец на голове/руке/ноге и тяни
            - Отпусти чтобы бросить
            - Двумя пальцами крути камеру
            - Кнопка "Сброс куклы" в игре
            
            Карты: Центр Города, Коробочный Полигон, Деревня Sasny
            
            Собрано автоматически из GitHub Actions.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
