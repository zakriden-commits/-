name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: "APK готов! Скачай app-debug.apk"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload log via API on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading gradle log via contents API..."
          # limit to 90k for API (max 1MB but base64 expands)
          head -n 600 gradle-build.log > /tmp/log_trunc.txt
          ls -R app/build 2>&1 | head -n 200 >> /tmp/log_trunc.txt || true
          find app -name "*.apk" 2>&1 >> /tmp/log_trunc.txt || true
          B64=$(base64 -w 0 /tmp/log_trunc.txt)
          # try to get existing sha
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/zakriden-commits/-/contents/build-failure.log?ref=arena/e132f078-repo" | jq -r '.sha // empty')
          echo "Existing SHA: $SHA"
          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/zakriden-commits/-/contents/build-failure.log -d "{\"message\":\"ci: build log $GITHUB_RUN_ID\",\"content\":\"$B64\",\"sha\":\"$SHA\",\"branch\":\"arena/e132f078-repo\"}" | head -n 50
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/zakriden-commits/-/contents/build-failure.log -d "{\"message\":\"ci: build log $GITHUB_RUN_ID\",\"content\":\"$B64\",\"branch\":\"arena/e132f078-repo\"}" | head -n 50
          fi
          echo "Done"
