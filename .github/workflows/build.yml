name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (install platforms)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>&1 | head -n 50 || true
          ls -la $ANDROID_HOME/cmdline-tools 2>&1 | head -n 50 || true
          ls -la /usr/local/lib/android/sdk 2>&1 | head -n 50 || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          echo "Using SDKMANAGER=$SDKMANAGER"
          $SDKMANAGER --version || echo "sdkmanager version failed"
          yes | $SDKMANAGER --licenses || echo "licenses accept done or failed, continue"
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || echo "sdkmanager install attempted (may already exist)"
          $SDKMANAGER --list_installed 2>&1 | head -n 80 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle version check
        run: ./gradlew --version 2>&1 | tee gradle-version.log

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            gradle-*.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: |
            🎮 **Ragdoll Sasny** — APK готов к установке!
            
            **Как установить на Android (актуально на 11 ноября 2027):**
            1. Скачай `app-debug.apk` ниже
            2. Открой файл на телефоне
            3. Разреши установку из неизвестных источников если попросит
            4. Играй!
            Карты: Центр Города, Коробочный Полигон, Деревня Sasny
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
