name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          echo "=== LIST ==="
          ls -R app/build 2>&1 | head -n 200
          find app -name "*.apk" 2>&1 | head -n 20

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: "APK готов! Скачай app-debug.apk"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post log to gist on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating gist with build log..."
          # take first 8000 chars for api limit
          head -c 8000 gradle-build.log > /tmp/gist.log || true
          # also append ls
          ls -R app/build 2>&1 | head -n 200 >> /tmp/gist.log || true
          gh api gists --method POST -f public=false -f description="gradle build log $GITHUB_RUN_ID" -f "files[build.log][content]=@/tmp/gist.log" --jq '.html_url' 2>&1 | tee /tmp/gist_url.txt || true
          cat /tmp/gist_url.txt || true
          # also try to output to summary
          echo "## Build failure log" >> $GITHUB_STEP_SUMMARY
          head -n 300 gradle-build.log >> $GITHUB_STEP_SUMMARY || true
