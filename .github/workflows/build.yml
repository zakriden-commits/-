name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          set +o pipefail
          echo "=== LS ==="
          ls -R app/build 2>&1 | head -n 400 || true
          find app -name "*.apk" 2>&1 | head -n 20 || true
          ls -lh app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: "APK готов! Скачай app-debug.apk — Ragdoll Sasny: хватай куклу за любую часть тела и кидай в город, всё разрушаемо. 3 карты."
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save log on failure (gh api)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Saving log via gh api..."
          head -n 600 gradle-build.log > /tmp/log.txt 2>&1 || echo "no log" > /tmp/log.txt
          ls -R app/build 2>&1 | head -n 400 >> /tmp/log.txt || true
          B64=$(base64 -w 0 /tmp/log.txt)
          gh api repos/zakriden-commits/-/contents/ci-logs/run-${{ github.run_number }}.log --method PUT -f message="ci: build log ${{ github.run_number }} [skip ci]" -f content="$B64" -f branch="arena/e132f078-repo" 2>&1 | head -n 50 || true
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/zakriden-commits/-/contents/ci-logs/run-${{ github.run_number }}-curl.log -d "{\"message\":\"ci: curl log ${{ github.run_number }} [skip ci]\",\"content\":\"$B64\",\"branch\":\"arena/e132f078-repo\"}" 2>&1 | head -n 50 || true
