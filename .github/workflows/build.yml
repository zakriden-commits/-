name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (install platforms)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME | head -n 50 || true
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          sdkmanager --list_installed | head -n 80 || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle version check
        run: ./gradlew --version 2>&1 | tee gradle-version.log

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
        # always continue to upload log even on failure
      - name: Upload build log on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            gradle-*.log
            app/build/outputs/logs/*.txt
            app/build/reports/**/*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: |
            🎮 **Ragdoll Sasny** — APK готов к установке!
            
            **Как установить на Android (актуально на 11 ноября 2027):**
            1. Скачай `app-debug.apk` ниже
            2. Открой файл на телефоне
            3. Разреши установку из неизвестных источников если попросит
            4. Играй!
            Карты: Центр Города, Коробочный Полигон, Деревня Sasny
            Собрано автоматически из GitHub Actions.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
