name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: "APK готов! Скачай app-debug.apk"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed, creating issue with log"
          LOG=$(head -c 65000 gradle-build.log | tail -c 65000)
          # truncate to 5000 for issue body limit
          BODY=$(head -n 200 gradle-build.log)
          # use gh to create issue
          gh issue create --title "Build failed run $GITHUB_RUN_ID" --body "Build log:\n\`\`\`\n$BODY\n\`\`\`" || echo "issue create failed, trying api"
          # also try curl
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/zakriden-commits/-/issues -d "{\"title\":\"Build log $GITHUB_RUN_ID\",\"body\":\"\`\`\`$(head -n 120 gradle-build.log | sed 's/\"/\\"/g' | head -c 5000)\`\`\`\"}" || true
          # also write to step summary for visibility
          echo "## Build log" >> $GITHUB_STEP_SUMMARY
          head -n 400 gradle-build.log >> $GITHUB_STEP_SUMMARY || true

