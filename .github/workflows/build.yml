name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          $SDKMANAGER --version || echo "sdkmanager version fail"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          echo "=== BUILD EXIT CODE: $?" 
          echo "=== Listing app/build ==="
          ls -R app/build 2>&1 | head -n 500
          echo "=== Find APK ==="
          find app -name "*.apk" -type f 2>&1 | head -n 50
          echo "=== Contents of app/build/outputs if exists ==="
          ls -lh app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            gradle-*.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: |
            🎮 Ragdoll Sasny — APK готов!
            Скачай app-debug.apk ниже. Зажми любую часть куклы и кидай в город — всё разрушаемо.
            Карты: Центр Города, Коробочный Полигон, Деревня
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
