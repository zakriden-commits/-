name: Build APK

on:
  push:
    branches: [ "arena/e132f078-repo", "main" ]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          if [ ! -f "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          echo "=== LS ==="
          ls -R app/build 2>&1 | head -n 300
          find app -name "*.apk" 2>&1 | head -n 20

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RagdollSasny-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/e132f078-repo')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "Ragdoll Sasny v1.0 #${{ github.run_number }}"
          body: "APK готов! Скачай app-debug.apk — Ragdoll Sasny с разрушаемым городом"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save log on failure
        if: failure()
        run: |
          echo "Saving failure log to repo [skip ci]"
          mkdir -p build-logs
          cp gradle-build.log build-logs/build-${{ github.run_number }}.log || echo "no log"
          ls -R app/build 2>&1 | head -n 500 >> build-logs/build-${{ github.run_number }}.log || true
          find app -name "*.apk" 2>&1 >> build-logs/build-${{ github.run_number }}.log || true
          git config user.name "ci-bot"
          git config user.email "ci@github.com"
          git add build-logs/
          git commit -m "ci: build log ${{ github.run_number }} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/e132f078-repo || echo "push failed"
